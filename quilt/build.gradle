plugins{id 'org.quiltmc.loom' version project.quilt_loom_version'}
repositories{maven{url='https://maven.quiltmc.org/repository/release/'};maven{url='https://maven.fabricmc.net/'}}
dependencies{
 minecraft "com.mojang:minecraft:"+project.minecraft_version
 // Minecraft 26.3 is non-obfuscated; Quilt no longer publishes Quilt Mappings for new Minecraft versions.
 modImplementation "org.quiltmc:quilt-loader:"+project.quilt_loader_version
 modImplementation "net.fabricmc.fabric-api:fabric-api:"+project.fabric_api_version
}
java{toolchain.languageVersion=JavaLanguageVersion.of(25)}
tasks.withType(JavaCompile).configureEach{options.release=25;options.encoding='UTF-8'}
sourceSets.main.java.srcDirs=['../common/src/main/java','src/main/java']
