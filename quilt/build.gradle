plugins{id 'org.quiltmc.loom' version '1.9.0'}
repositories{maven{url='https://maven.quiltmc.org/repository/release/'};maven{url='https://maven.fabricmc.net/'}}
dependencies{
 minecraft "com.mojang:minecraft:"+project.minecraft_version
 mappings "org.quiltmc:quilt-mappings:1.21.11+build.2:intermediary-v2"
 modImplementation "org.quiltmc:quilt-loader:"+project.quilt_loader_version
 modImplementation "net.fabricmc.fabric-api:fabric-api:"+project.fabric_api_version
}
java{toolchain.languageVersion=JavaLanguageVersion.of(25)}
tasks.withType(JavaCompile).configureEach{options.release=25;options.encoding='UTF-8'}
sourceSets.main.java.srcDirs=['../common/src/main/java','src/main/java']
