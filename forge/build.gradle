plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = project.version
group = project.group

base {
    archivesName = 'minegeeks-for-servers-forge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    mappings channel: 'official', version: project.minecraft_version

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
        }

        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
}

sourceSets {
    main {
        java.srcDirs = ["../common/src/main/java", "src/main/java"]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

processResources {
    inputs.properties([
        minecraft_version: project.minecraft_version,
        mod_id: 'minegeeks_for_servers',
        mod_name: 'MineGeeks For Servers',
        mod_version: project.version,
        mod_authors: 'Wellingtom Garcez',
        mod_description: 'Server-side cosmic generator and custom powers for Minecraft 26.3.'
    ])

    filesMatching('META-INF/mods.toml') {
        expand([
            minecraft_version: project.minecraft_version,
            mod_id: 'minegeeks_for_servers',
            mod_name: 'MineGeeks For Servers',
            mod_version: project.version,
            mod_authors: 'Wellingtom Garcez',
            mod_description: 'Server-side cosmic generator and custom powers for Minecraft 26.3.'
        ])
    }
}

jar {
    finalizedBy 'reobfJar'
}
