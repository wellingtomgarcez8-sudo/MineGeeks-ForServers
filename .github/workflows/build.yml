name: Build MineGeeks For Servers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minegeeks-for-servers-build
  cancel-in-progress: true

jobs:
  fabric:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MineGeeks-For-Servers-Fabric-26.3
          path: fabric/build/libs/*.jar

  forge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MineGeeks-For-Servers-Forge-26.3
          path: forge/build/libs/*.jar

  neoforge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neoforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MineGeeks-For-Servers-NeoForge-26.3
          path: neoforge/build/libs/*.jar

  quilt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quilt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MineGeeks-For-Servers-Quilt-26.3
          path: quilt/build/libs/*.jar

  release:
    needs: [fabric, forge, neoforge, quilt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-mc26.3
          name: MineGeeks For Servers 1.0.0 - Minecraft 26.3
          prerelease: true
          files: release/**/*.jar
