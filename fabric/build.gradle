plugins{id 'net.fabricmc.fabric-loom' version project.loom_version}
dependencies{
 minecraft "com.mojang:minecraft:"+project.minecraft_version
 mappings loom.officialMojangMappings()
 modImplementation "net.fabricmc:fabric-loader:"+project.loader_version
 modImplementation "net.fabricmc.fabric-api:fabric-api:"+project.fabric_api_version
}
java{toolchain.languageVersion=JavaLanguageVersion.of(25)}
tasks.withType(JavaCompile).configureEach{options.release=25;options.encoding='UTF-8'}
sourceSets.main.java.srcDirs=['../common/src/main/java','src/main/java']
